name: Incremental stock discovery
on:
  workflow_dispatch:
  schedule:
    - cron: '30 23 * * 1-5'
permissions:
  contents: write
concurrency:
  group: stock-radar-daily-scan
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install "exchange-calendars>=4.6,<5"
      - name: Run incremental scan
        env:
          RADAR_BATCH_SIZE: '1250'
          RADAR_DOWNLOAD_CHUNK: '25'
          RADAR_STALE_CALENDAR_DAYS: '5'
          RADAR_ENRICH_LIMIT: '5'
          RADAR_SEC_LIMIT: '0'
          RADAR_RETRY_LIMIT: '20'
          RADAR_SEC_USER_AGENT: ${{ secrets.RADAR_SEC_USER_AGENT }}
        run: python auto_scan.py
      - name: Enrich screened candidates with SEC fundamentals
        env:
          RADAR_SEC_USER_AGENT: ${{ secrets.RADAR_SEC_USER_AGENT }}
          RADAR_SEC_DAILY_LIMIT: '50'
        run: python sec_enrich.py
      - name: Build candidate quality and research snapshots
        run: python candidate_quality.py
      - name: Build experimental V5.3 research scores
        run: python investment_research.py
      - name: Record prospective snapshots and price observations
        run: python forward_tracking.py
      - name: Audit prospective ledger integrity
        run: python tracking_audit.py
      - name: Build V5.7 prospective cohort evaluation
        run: python prospective_evaluation.py
      - name: Verify V5.7 reports
        run: |
          python - <<'PY_VERIFY'
          from pathlib import Path
          for name in ('investment_research_scores.csv','prospective_score_snapshots.csv','prospective_price_outcomes.csv','prospective_tracking_status.json','prospective_spy_observations.csv','prospective_audit_status.json','prospective_audit_manifest.json','prospective_evaluation.csv','prospective_evaluation_status.json'):
              if not (Path('data')/name).exists():
                  raise SystemExit(f'Missing report: {name}')
          PY_VERIFY
      - name: Commit scan results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/discovery.csv data/status.json data/cursor.json data/scan_coverage.csv data/sec_enrichment_status.json data/price_failures_last_run.csv data/limited_history.csv data/candidate_quality.csv data/candidate_quality_status.json data/candidate_snapshots.csv data/financial_validation.csv data/investment_research_scores.csv data/investment_research_status.json data/prospective_score_snapshots.csv data/prospective_price_outcomes.csv data/prospective_tracking_status.json data/prospective_spy_observations.csv data/prospective_audit_status.json data/prospective_audit_manifest.json data/prospective_evaluation.csv data/prospective_evaluation_status.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update stock discovery snapshot"
            git push
          fi
